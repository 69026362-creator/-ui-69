<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <meta content="mobile_blank" name="shell-type" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
      /* Rule-of-thirds grid helper — uncomment border to see the 3×3 */
      .thirds-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
      }
      @media (max-width: 768px) {
        .thirds-grid {
          display: flex;
          flex-direction: column;
        }
        .col-start-2 { display: none; }
        .col-start-3 { order: 2; }
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'tertiary-fixed': '#e6e1df',
              primary: '#000000',
              'inverse-on-surface': '#f0f1f1',
              'tertiary-container': '#1d1b1a',
              'on-secondary-fixed-variant': '#464747',
              'secondary-container': '#e3e2e2',
              'outline-variant': '#c4c7c7',
              'on-tertiary-fixed': '#1d1b1a',
              'on-error': '#ffffff',
              'on-error-container': '#93000a',
              'surface-container-low': '#f3f3f4',
              'surface-bright': '#f9f9f9',
              'primary-fixed-dim': '#c8c6c5',
              'on-surface-variant': '#444748',
              'surface-tint': '#5f5e5e',
              'inverse-surface': '#2f3131',
              surface: '#f9f9f9',
              'tertiary-fixed-dim': '#cac6c3',
              tertiary: '#000000',
              'on-primary-container': '#858383',
              'surface-container-highest': '#e2e2e2',
              'surface-container-lowest': '#ffffff',
              'on-primary-fixed': '#1c1b1b',
              'on-primary': '#ffffff',
              'on-surface': '#1a1c1c',
              'on-tertiary': '#ffffff',
              'on-tertiary-container': '#868381',
              'error-container': '#ffdad6',
              'primary-container': '#1c1b1b',
              'primary-fixed': '#e5e2e1',
              'secondary-fixed-dim': '#c7c6c6',
              'inverse-primary': '#c8c6c5',
              background: '#f9f9f9',
              'on-secondary-container': '#646464',
              'secondary-fixed': '#e3e2e2',
              'surface-container-high': '#e8e8e8',
              secondary: '#5e5e5e',
              'on-secondary': '#ffffff',
              'surface-variant': '#e2e2e2',
              'on-background': '#1a1c1c',
              'surface-dim': '#dadada',
              'on-tertiary-fixed-variant': '#484645',
              'on-secondary-fixed': '#1b1c1c',
              'on-primary-fixed-variant': '#474646',
              error: '#ba1a1a',
              outline: '#747878',
              'surface-container': '#eeeeee',
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px',
            },
            spacing: {
              'margin-mobile': '1.25rem',
              'space-sm': '0.5rem',
              'space-xs': '0.25rem',
              gutter: '1.5rem',
              'gutter-mobile': '1rem',
              'space-lg': '1.5rem',
              'space-xl': '2.5rem',
              margin: '3rem',
              'space-md': '1rem',
            },
            fontFamily: {
              'headline-xl': ['Hanken Grotesk'],
              'label-sm': ['Hanken Grotesk'],
              'headline-lg-mobile': ['Hanken Grotesk'],
              'headline-xl-mobile': ['Hanken Grotesk'],
              'body-lg': ['Hanken Grotesk'],
              'headline-md': ['Hanken Grotesk'],
              'headline-lg': ['Hanken Grotesk'],
              'body-sm': ['Hanken Grotesk'],
              'body-md': ['Hanken Grotesk'],
              'label-lg': ['Hanken Grotesk'],
              'label-md': ['Hanken Grotesk'],
            },
            fontSize: {
              'headline-xl': [
                '40px',
                {
                  lineHeight: '48px',
                  letterSpacing: '-0.02em',
                  fontWeight: '600',
                },
              ],
              'label-sm': [
                '11px',
                {
                  lineHeight: '14px',
                  letterSpacing: '0.04em',
                  fontWeight: '500',
                },
              ],
              'headline-lg-mobile': [
                '22px',
                { lineHeight: '30px', letterSpacing: '0em', fontWeight: '500' },
              ],
              'headline-xl-mobile': [
                '28px',
                {
                  lineHeight: '36px',
                  letterSpacing: '-0.01em',
                  fontWeight: '600',
                },
              ],
              'body-lg': ['17px', { lineHeight: '26px', fontWeight: '400' }],
              'headline-md': [
                '20px',
                { lineHeight: '28px', fontWeight: '500' },
              ],
              'headline-lg': [
                '28px',
                {
                  lineHeight: '36px',
                  letterSpacing: '-0.01em',
                  fontWeight: '500',
                },
              ],
              'body-sm': ['13px', { lineHeight: '18px', fontWeight: '400' }],
              'body-md': ['15px', { lineHeight: '22px', fontWeight: '400' }],
              'label-lg': [
                '14px',
                {
                  lineHeight: '20px',
                  letterSpacing: '0.01em',
                  fontWeight: '500',
                },
              ],
              'label-md': [
                '12px',
                {
                  lineHeight: '16px',
                  letterSpacing: '0.02em',
                  fontWeight: '500',
                },
              ],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-surface-container-lowest font-body-md text-on-surface antialiased pt-safe pb-safe min-h-screen"
  >
    <!--
      Rule-of-thirds layout:
      The viewport is divided into a 3×3 grid. Key elements land on or near
      the four power-point intersections:
        - Upper-left power point: "Register" headline
        - Lower-left power point: form submit button
        - Upper-right power point: "Patron Portal" label + visual accent
        - Lower-right power point: sign-in link + footer
    -->
    <main
      class="thirds-grid relative w-full min-h-screen bg-surface-container-lowest"
    >
      <!-- ── Row 1 ────────────────────────────────────────────── -->

      <!-- Col 1, Row 1: header brand (top-left third) -->
      <div class="col-start-1 row-start-1 flex items-start p-margin-mobile">
        <span class="font-headline-md text-headline-md tracking-tight text-primary"
          >Library</span
        >
      </div>

      <!-- Col 2, Row 1: empty visual breath -->
      <div class="col-start-2 row-start-1"></div>

      <!-- Col 3, Row 1: Patron Portal label — upper-right power point -->
      <div class="col-start-3 row-start-1 flex flex-col items-start justify-start p-margin-mobile pt-space-lg">
        <span
          class="font-label-sm text-label-sm tracking-widest text-secondary uppercase"
          >Patron Portal</span
        >
        <div class="w-12 h-px bg-primary mt-space-sm"></div>
      </div>

      <!-- ── Row 2 ────────────────────────────────────────────── -->

      <!-- Col 1, Row 2: hero headline — upper-left power point -->
      <div class="col-start-1 row-start-2 flex flex-col justify-center px-margin-mobile">
        <h1
          class="font-headline-xl-mobile text-headline-xl-mobile tracking-tight text-primary"
        >
          Register
        </h1>
        <p class="font-body-md text-body-md text-secondary mt-space-xs max-w-[14rem]">
          Apply for a patron card to start borrowing from the collection.
        </p>
      </div>

      <!-- Col 2, Row 2: vertical divider accent (center third) -->
      <div class="col-start-2 row-start-2 flex items-center justify-center">
        <div class="w-px h-full bg-outline-variant opacity-50"></div>
      </div>

      <!-- Col 3, Row 2: Sign In link — right-third vertical alignment -->
      <div class="col-start-3 row-start-2 flex items-start justify-end p-margin-mobile pt-space-lg">
        <a
          class="font-label-md text-label-md underline tracking-wider uppercase text-primary hover:opacity-70 transition-opacity"
          href="#"
          >Sign In</a
        >
      </div>

      <!-- ── Row 3 ────────────────────────────────────────────── -->

      <!-- Col 1, Row 3: form — lower-left power point -->
      <div class="col-start-1 row-start-3 flex flex-col justify-end px-margin-mobile pb-space-lg">
        <form
          class="flex flex-col gap-y-space-md"
          onsubmit="event.preventDefault();"
        >
          <div class="flex flex-col gap-y-space-xs">
            <label
              class="font-label-md text-label-md text-secondary uppercase tracking-wider"
              for="fullName"
              >Full Name</label
            >
            <input
              class="w-full bg-surface-container-lowest text-primary font-body-md text-body-md px-space-md py-space-sm rounded-none focus:outline-none placeholder:text-outline"
              id="fullName"
              onblur="this.style.borderColor='#dddddd'"
              onfocus="this.style.borderColor='#111111'"
              placeholder="e.g. Eleanor Vance"
              required=""
              style="border: 1px solid #dddddd"
              type="text"
            />
          </div>
          <div class="flex flex-col gap-y-space-xs">
            <label
              class="font-label-md text-label-md text-secondary uppercase tracking-wider"
              for="emailAddress"
              >Email Address</label
            >
            <input
              class="w-full bg-surface-container-lowest text-primary font-body-md text-body-md px-space-md py-space-sm rounded-none focus:outline-none placeholder:text-outline"
              id="emailAddress"
              onblur="this.style.borderColor='#dddddd'"
              onfocus="this.style.borderColor='#111111'"
              placeholder="name@domain.org"
              required=""
              style="border: 1px solid #dddddd"
              type="email"
            />
          </div>
          <div class="flex flex-col gap-y-space-xs">
            <label
              class="font-label-md text-label-md text-secondary uppercase tracking-wider"
              for="cardPin"
              >Card PIN / Password</label
            >
            <input
              class="w-full bg-surface-container-lowest text-primary font-body-md text-body-md px-space-md py-space-sm rounded-none focus:outline-none placeholder:text-outline"
              id="cardPin"
              onblur="this.style.borderColor='#dddddd'"
              onfocus="this.style.borderColor='#111111'"
              placeholder="••••••••"
              required=""
              style="border: 1px solid #dddddd"
              type="password"
            />
          </div>
          <div class="flex flex-col gap-y-space-xs">
            <label
              class="font-label-md text-label-md text-secondary uppercase tracking-wider"
              for="confirmPin"
              >Confirm Password</label
            >
            <input
              class="w-full bg-surface-container-lowest text-primary font-body-md text-body-md px-space-md py-space-sm rounded-none focus:outline-none placeholder:text-outline"
              id="confirmPin"
              onblur="this.style.borderColor='#dddddd'"
              onfocus="this.style.borderColor='#111111'"
              placeholder="••••••••"
              required=""
              style="border: 1px solid #dddddd"
              type="password"
            />
          </div>
          <div class="flex flex-col gap-y-space-xs">
            <label
              class="font-label-md text-label-md text-secondary uppercase tracking-wider"
              for="preferredBranch"
              >Preferred Branch</label
            >
            <select
              class="w-full bg-surface-container-lowest text-primary font-body-md text-body-md px-space-md py-space-sm rounded-none focus:outline-none"
              id="preferredBranch"
              onblur="this.style.borderColor='#dddddd'"
              onfocus="this.style.borderColor='#111111'"
              style="border: 1px solid #dddddd"
            >
              <option value="central">Central Research Library</option>
              <option value="north">North Quad Memorial Archive</option>
              <option value="south">South Annex &amp; Periodicals</option>
              <option value="west">West End Rare Books Division</option>
            </select>
          </div>
          <div class="flex items-start gap-x-space-sm pt-space-xs">
            <input
              class="mt-1 h-3.5 w-3.5 rounded-none accent-primary cursor-pointer"
              id="terms"
              required=""
              style="border: 1px solid #111111"
              type="checkbox"
            />
            <label
              class="font-body-sm text-body-sm text-secondary select-none cursor-pointer"
              for="terms"
            >
              I agree to the standard 28-day circulation and return rules.
            </label>
          </div>
          <button
            class="w-full font-label-lg text-label-lg py-space-sm px-space-md uppercase tracking-wider rounded-none transition-opacity hover:opacity-90 active:opacity-75 mt-space-sm text-primary bg-surface-container-lowest"
            style="border: 1px solid rgb(17, 17, 17)"
            type="submit"
          >
            Register
          </button>
        </form>
      </div>

      <!-- Col 2, Row 3: empty breath -->
      <div class="col-start-2 row-start-3"></div>

      <!-- Col 3, Row 3: sign-in link + footer — lower-right power point -->
      <div class="col-start-3 row-start-3 flex flex-col justify-end items-end p-margin-mobile pb-space-lg gap-y-space-lg">
        <a
          class="font-body-sm text-body-sm text-primary underline hover:opacity-70 transition-opacity text-right"
          href="#"
        >
          Already registered?
          <br />Sign in here
        </a>
        <footer class="text-right">
          <p
            class="font-label-sm text-label-sm text-outline tracking-wider uppercase"
          >
            Public Library System
            <br />Minimalist Reader Terminal
          </p>
        </footer>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
